openapi: 3.0.3
info:
  title: Wufoo REST Comments Widgets API
  description: 'The Wufoo REST API v3 provides programmatic read and write access to a Wufoo

    account: Forms, Fields, Entries, Reports, Widgets, Comments, Users, and

    Webhooks. Every request is per-subdomain and authenticates with the account

    API key over HTTP Basic Auth. Endpoints support `.json` or `.xml` response

    formats by appending the extension to the URL.

    '
  version: '3.0'
  contact:
    name: Wufoo Support
    url: https://help.surveymonkey.com/wufoo/
  license:
    name: Wufoo Terms of Use
    url: https://www.wufoo.com/terms-of-use/
servers:
- url: https://{subdomain}.wufoo.com/api/v3
  description: Wufoo account subdomain
  variables:
    subdomain:
      default: account
      description: Your Wufoo account subdomain.
security:
- basicAuth: []
tags:
- name: Widgets
  description: Read widgets inside reports.
paths:
  /reports/{identifier}/widgets.{format}:
    get:
      tags:
      - Widgets
      summary: List Report Widgets
      description: Returns the widgets that compose a report.
      operationId: listReportWidgets
      parameters:
      - $ref: '#/components/parameters/Identifier'
      - $ref: '#/components/parameters/Format'
      - name: pretty
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Widget list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Widgets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      properties:
        Hash:
          type: string
        Name:
          type: string
        Size:
          type: string
        Type:
          type: string
        TypeDesc:
          type: string
        Report:
          type: string
  parameters:
    Format:
      name: format
      in: path
      required: true
      description: Response serialization format.
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
    Identifier:
      name: identifier
      in: path
      required: true
      description: Form or report hash (preferred) or its title.
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic Auth. Use your Wufoo API key as the username and any non-empty

        string as the password. Servers require TLS v1.0 or higher; SSLv3 and lower

        are blocked.

        '
