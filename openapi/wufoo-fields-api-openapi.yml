openapi: 3.0.3
info:
  title: Wufoo REST Comments Fields API
  description: 'The Wufoo REST API v3 provides programmatic read and write access to a Wufoo

    account: Forms, Fields, Entries, Reports, Widgets, Comments, Users, and

    Webhooks. Every request is per-subdomain and authenticates with the account

    API key over HTTP Basic Auth. Endpoints support `.json` or `.xml` response

    formats by appending the extension to the URL.

    '
  version: '3.0'
  contact:
    name: Wufoo Support
    url: https://help.surveymonkey.com/wufoo/
  license:
    name: Wufoo Terms of Use
    url: https://www.wufoo.com/terms-of-use/
servers:
- url: https://{subdomain}.wufoo.com/api/v3
  description: Wufoo account subdomain
  variables:
    subdomain:
      default: account
      description: Your Wufoo account subdomain.
security:
- basicAuth: []
tags:
- name: Fields
  description: Read the field structure of a form or report.
paths:
  /forms/{identifier}/fields.{format}:
    get:
      tags:
      - Fields
      summary: List Form Fields
      description: Returns the field structure for the given form.
      operationId: listFormFields
      parameters:
      - $ref: '#/components/parameters/Identifier'
      - $ref: '#/components/parameters/Format'
      - name: system
        in: query
        description: Include system fields (IP, LastPage, CompleteSubmission, Status, PurchaseTotal, Currency, TransactionId, MerchantType).
        schema:
          type: boolean
      - name: pretty
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Field list for the form.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
  /reports/{identifier}/fields.{format}:
    get:
      tags:
      - Fields
      summary: List Report Fields
      description: Returns the field structure of the underlying report.
      operationId: listReportFields
      parameters:
      - $ref: '#/components/parameters/Identifier'
      - $ref: '#/components/parameters/Format'
      - name: system
        in: query
        schema:
          type: boolean
      - name: pretty
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Report field list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
components:
  parameters:
    Format:
      name: format
      in: path
      required: true
      description: Response serialization format.
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
    Identifier:
      name: identifier
      in: path
      required: true
      description: Form or report hash (preferred) or its title.
      schema:
        type: string
  schemas:
    Field:
      type: object
      properties:
        Title:
          type: string
        Instructions:
          type: string
        IsRequired:
          type: string
        ClassNames:
          type: string
        DefaultVal:
          type: string
        Page:
          type: integer
        Type:
          type: string
        ID:
          type: string
        SubFields:
          type: array
          items:
            type: object
            properties:
              DefaultVal:
                type: string
              Label:
                type: string
              ID:
                type: string
        Choices:
          type: array
          items:
            type: object
            properties:
              Label:
                type: string
              Score:
                type: integer
        HasOtherField:
          type: boolean
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic Auth. Use your Wufoo API key as the username and any non-empty

        string as the password. Servers require TLS v1.0 or higher; SSLv3 and lower

        are blocked.

        '
