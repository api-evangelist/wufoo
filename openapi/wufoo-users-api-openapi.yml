openapi: 3.0.3
info:
  title: Wufoo REST Comments Users API
  description: 'The Wufoo REST API v3 provides programmatic read and write access to a Wufoo

    account: Forms, Fields, Entries, Reports, Widgets, Comments, Users, and

    Webhooks. Every request is per-subdomain and authenticates with the account

    API key over HTTP Basic Auth. Endpoints support `.json` or `.xml` response

    formats by appending the extension to the URL.

    '
  version: '3.0'
  contact:
    name: Wufoo Support
    url: https://help.surveymonkey.com/wufoo/
  license:
    name: Wufoo Terms of Use
    url: https://www.wufoo.com/terms-of-use/
servers:
- url: https://{subdomain}.wufoo.com/api/v3
  description: Wufoo account subdomain
  variables:
    subdomain:
      default: account
      description: Your Wufoo account subdomain.
security:
- basicAuth: []
tags:
- name: Users
  description: Read account user information.
paths:
  /users.{format}:
    get:
      tags:
      - Users
      summary: List Account Users
      description: Returns all users in the account, including sub-users (each holds their own API key).
      operationId: listUsers
      parameters:
      - $ref: '#/components/parameters/Format'
      - name: pretty
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
components:
  parameters:
    Format:
      name: format
      in: path
      required: true
      description: Response serialization format.
      schema:
        type: string
        enum:
        - json
        - xml
        default: json
  schemas:
    User:
      type: object
      properties:
        User:
          type: string
        Email:
          type: string
        FirstName:
          type: string
        LastName:
          type: string
        Company:
          type: string
        TimeZone:
          type: string
        SubdomainPrefix:
          type: string
        Hash:
          type: string
        IsAccountOwner:
          type: string
        ApiKey:
          type: string
        LinkForms:
          type: string
          format: uri
        LinkReports:
          type: string
          format: uri
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic Auth. Use your Wufoo API key as the username and any non-empty

        string as the password. Servers require TLS v1.0 or higher; SSLv3 and lower

        are blocked.

        '
